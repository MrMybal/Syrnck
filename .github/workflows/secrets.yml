name: Secret scanning
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build pinned Gitleaks CLI
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          mkdir -p .tools/gitleaks
          go mod download -json github.com/zricethezav/gitleaks/v8@v8.30.1 > .tools/gitleaks-source.json
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('.tools/gitleaks-source.json').read_text())
          expected = {
              'Path': 'github.com/zricethezav/gitleaks/v8',
              'Version': 'v8.30.1',
              'Sum': 'h1:PmEvCfVI7ti9dV3s5aMZUY7sS2GxRvG3yzih7E+cS3w=',
              'GoModSum': 'h1:rTDwxRjufMKAkhTI/Mijd07nday1yOhf9qywjwz5Irw=',
          }
          for key, value in expected.items():
              if source.get(key) != value:
                  raise SystemExit('Gitleaks source verification failed: ' + key)
          PY
          GOBIN="$PWD/.tools/gitleaks" go install -ldflags="-X github.com/zricethezav/gitleaks/v8/version.Version=8.30.1" github.com/zricethezav/gitleaks/v8@v8.30.1
          .tools/gitleaks/gitleaks version
      - name: Verify narrow fixture exception
        run: python tests/secret_scanner.py --gitleaks .tools/gitleaks/gitleaks
      - name: Scan publishable working tree
        run: python scripts/scan_secrets.py --gitleaks .tools/gitleaks/gitleaks --report .scratch/gitleaks-working-tree.json
      - name: Scan complete fetched history
        run: python scripts/scan_secrets.py --gitleaks .tools/gitleaks/gitleaks --mode history --report .scratch/gitleaks-history.json
