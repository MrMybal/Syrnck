name: Secret scanning
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          mkdir -p .tools/gitleaks
          curl --retry 4 --retry-delay 2 --retry-max-time 90 --connect-timeout 15 --max-time 60 --fail --silent --show-error --location --output .tools/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' '.tools/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .tools/gitleaks.tar.gz -C .tools/gitleaks
          .tools/gitleaks/gitleaks version
      - name: Verify narrow fixture exception
        run: python tests/secret_scanner.py --gitleaks .tools/gitleaks/gitleaks
      - name: Scan publishable working tree
        run: python scripts/scan_secrets.py --gitleaks .tools/gitleaks/gitleaks --report .scratch/gitleaks-working-tree.json
      - name: Scan complete fetched history
        run: python scripts/scan_secrets.py --gitleaks .tools/gitleaks/gitleaks --mode history --report .scratch/gitleaks-history.json
